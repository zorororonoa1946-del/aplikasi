plugins { id 'com.android.application' }
android {
 namespace 'id.nusastudio.vault'
 compileSdk 35
 ndkVersion "27.2.12479018"
 externalNativeBuild { cmake { path file("src/main/cpp/CMakeLists.txt"); version "3.22.1" } }
 defaultConfig {
  applicationId 'id.nusastudio.vault'
  minSdk 26
  targetSdk 35
  versionCode 3
  versionName '1.2.0'
  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
  externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', '-DCMAKE_BUILD_TYPE=Release'; targets 'nusacrypto' } }
  testInstrumentationRunner 'id.nusastudio.vault.VaultInstrumentation'
 }
 buildTypes { release { minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
