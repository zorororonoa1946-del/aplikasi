name: Build and test
on:
  push:
    paths-ignore:
      - 'artifacts/**'
      - '**/*.md'
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:browser
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - run: npm run test:container
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned SDK components using the runner's Android SDK
        shell: bash
        run: |
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          python3 - "$manager" <<'PYSDK'
          import subprocess,sys
          subprocess.run([sys.argv[1],'--licenses'],input='y\n'*100,text=True,check=True)
          PYSDK
          "$manager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Select accelerated or software emulator
        id: emulator
        shell: bash
        run: |
          if [[ -c /dev/kvm ]] && sudo chmod a+rw /dev/kvm && [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo 'api=35' >> "$GITHUB_OUTPUT"
            echo 'accel=auto' >> "$GITHUB_OUTPUT"
            echo 'Android 35 with KVM'
          else
            echo 'api=26' >> "$GITHUB_OUTPUT"
            echo 'accel=off' >> "$GITHUB_OUTPUT"
            echo 'KVM unavailable: testing Android 26 with software emulation; compile/target SDK remains 35'
          fi
      - run: npm ci
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ steps.emulator.outputs.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -cores 2 -memory 2048 -accel ${{ steps.emulator.outputs.accel }}
          script: bash scripts/ci-android.sh
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          NUSA_DISPOSABLE_EMULATOR: '1'
      - run: scripts/android-build.sh assembleDebug lintDebug
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: nusa-debug-apk-and-test-results
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/lint-results-debug.html
            artifacts/android-test-results.txt
            ${{ runner.temp }}/nusa-android-ci.log
