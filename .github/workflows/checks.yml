name: Build and test
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:browser
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - run: docker build -t nusa-vault:ci .
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - run: npm ci
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: npm run test:android
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      # Rebuild after test-only localhost trust resources have been removed.
      - run: scripts/android-build.sh assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nusa-debug-apk-and-test-results
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            artifacts/android-test-results.txt
