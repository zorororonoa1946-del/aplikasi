services:
  relay:
    build:
      context: ..
    restart: unless-stopped
    environment:
      RELAY_TOKEN: ${RELAY_TOKEN:?Run npm run relay:init first}
    volumes:
      - vault-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  https:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      VAULT_DOMAIN: ${VAULT_DOMAIN:?Set your public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - relay
volumes:
  vault-data:
  caddy-data:
  caddy-config:
